name: build image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      image:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      description:
        required: true
        type: string
      platform:
        required: true
        type: string
      platform_key:
        required: true
        type: string
      runner:
        required: true
        type: string
      publish:
        required: true
        type: boolean
      export_e2e:
        required: true
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            wthueb/${{ inputs.image }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.description=${{ inputs.description }}
          annotations: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.description=${{ inputs.description }}

      - name: Build and stage by digest
        if: inputs.publish
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platform }}
          tags: |
            wthueb/${{ inputs.image }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.service }}-${{ inputs.platform_key }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ inputs.service }}-${{ inputs.platform_key }}

      - name: Record image digest
        if: inputs.publish
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digest"
          touch "${RUNNER_TEMP}/digest/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-${{ inputs.platform_key }}-digest
          path: ${{ runner.temp }}/digest/*
          if-no-files-found: error
          retention-days: 1

      - name: Build e2e image artifact
        if: ${{ !inputs.publish && inputs.export_e2e }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platform }}
          tags: ${{ inputs.image }}:e2e
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ inputs.service }}.tar
          cache-from: type=gha,scope=${{ inputs.service }}-${{ inputs.platform_key }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ inputs.service }}-${{ inputs.platform_key }}

      - name: Upload e2e image
        if: ${{ !inputs.publish && inputs.export_e2e }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ inputs.service }}-${{ inputs.platform_key }}-image
          path: ${{ runner.temp }}/${{ inputs.service }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Validate image build
        if: ${{ !inputs.publish && !inputs.export_e2e }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ inputs.service }}-${{ inputs.platform_key }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ inputs.service }}-${{ inputs.platform_key }}
