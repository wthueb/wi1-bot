---
# End-to-end pipeline stack: a seeded Radarr -> the webhook -> a transcoder worker,
# all sharing one media volume. Brought up by pytest-docker (tests/e2e/conftest.py).
#
# The webhook and transcoder services carry both `image:` and `build:` so this single
# file works everywhere: locally `docker compose up` builds the image if the :e2e tag
# is missing, while in CI the e2e job pre-builds the :e2e tags from the shared GHA
# layer cache so the same `up` reuses them without rebuilding.

services:
  # create the Radarr/Sonarr root folders inside the shared volume before they boot
  e2e-init:
    image: busybox:1.37
    command: >-
      sh -c "mkdir -p /media/movies /media/tv
      /media/blackhole/radarr/nzb /media/blackhole/radarr/watch
      /media/blackhole/sonarr/nzb /media/blackhole/sonarr/watch
      && chmod -R 777 /media"
    volumes:
      - type: volume
        source: e2e-media
        target: /media
        volume:
          nocopy: true

  wi1-bot-radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls311
    environment:
      # run as root + world-writable umask so the transcoder (also root) can replace
      # files Radarr imports into the shared volume, and vice-versa
      - PUID=0
      - PGID=0
      - UMASK=000
      - TZ=Etc/UTC
    ports:
      - "7878"
    volumes:
      # a throwaway copy of the committed seed; conftest sets E2E_RADARR_CONFIG so the
      # container never writes back into the git working tree
      - ${E2E_RADARR_CONFIG:?E2E_RADARR_CONFIG must be set by conftest}:/config
      - type: volume
        source: e2e-media
        target: /media
        volume:
          nocopy: true
      # the blacked-out download to import, mounted read-only; conftest sets the path
      - ${E2E_FIXTURES_DIR:?E2E_FIXTURES_DIR must be set by conftest}:/fixtures:ro
    depends_on:
      e2e-init:
        condition: service_completed_successfully
      e2e-release-server:
        condition: service_healthy

  wi1-bot-sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls320
    environment:
      - PUID=0
      - PGID=0
      - UMASK=000
      - TZ=Etc/UTC
    ports:
      - "8989"
    volumes:
      - ${E2E_SONARR_CONFIG:?E2E_SONARR_CONFIG must be set by conftest}:/config
      - type: volume
        source: e2e-media
        target: /media
        volume:
          nocopy: true
      - ${E2E_FIXTURES_DIR:?E2E_FIXTURES_DIR must be set by conftest}:/fixtures:ro
    depends_on:
      e2e-init:
        condition: service_completed_successfully
      e2e-release-server:
        condition: service_healthy

  e2e-release-server:
    image: python:3.12-alpine
    working_dir: /releases
    command: python -m http.server 8080
    volumes:
      - ./fixtures:/releases:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8080/release.nzb').read(1)
      interval: 1s
      timeout: 2s
      retries: 30

  wi1-bot-webhook:
    image: wi1-bot-webhook:e2e
    build:
      context: ../..
      dockerfile: Dockerfile.webhook
    ports:
      - "9000"
    environment:
      - WB_CONFIG_PATH=/config/config.yaml
      - WB_LOG_DIR=/logs
    volumes:
      - ./config/webhook.yaml:/config/config.yaml:ro
      - type: volume
        source: e2e-media
        target: /media
        volume:
          nocopy: true
    depends_on:
      - wi1-bot-radarr
      - wi1-bot-sonarr

  wi1-bot-transcoder:
    image: wi1-bot-transcoder:e2e
    build:
      context: ../..
      dockerfile: Dockerfile.transcoder
    environment:
      - WB_CONFIG_PATH=/config/config.yaml
      - WB_LOG_DIR=/logs
      # point the worker at the webhook's job API (overrides worker.webhook_url)
      - WB_WORKER__WEBHOOK_URL=http://wi1-bot-webhook:9000
    volumes:
      - ./config/transcoder.yaml:/config/config.yaml:ro
      - type: volume
        source: e2e-media
        target: /media
        volume:
          nocopy: true
    depends_on:
      - wi1-bot-webhook

volumes:
  # the shared media library; pytest-docker removes it on teardown (down -v)
  e2e-media:
